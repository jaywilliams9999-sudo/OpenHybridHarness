<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hub-secret" content="{{HUB_SECRET}}">
  <title>OpenHybridHarness · Models</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/models.js"></script>
</head>
<body>
  <header class="top">
    <a class="mark" href="/">OpenHybrid<span>Harness</span></a>
    <nav class="nav" aria-label="Pages">
      <a href="/">Board</a>
      <a href="/models" aria-current="page">Models</a>
    </nav>
  </header>

  <main class="page">
    <section id="card" class="strip" aria-label="GPU"></section>

    <section class="registry" aria-labelledby="h-models">
      <h2 id="h-models" class="column-head">Model registry</h2>
      <p class="lede">Every model the GPU service can load. Loading one may unload others to make room; the page says which before it asks.</p>
      <div class="table-wrap">
        <table class="models">
          <thead>
            <tr>
              <th scope="col">Model</th>
              <th scope="col">Backend</th>
              <th scope="col">Role</th>
              <th scope="col" class="num">Size</th>
              <th scope="col">State</th>
              <th scope="col" class="num">Last load</th>
              <th scope="col" class="num">Last used</th>
              <th scope="col"><span class="sr-only">Action</span></th>
            </tr>
          </thead>
          <tbody id="models-body"></tbody>
        </table>
      </div>
      <p id="models-error" class="inline-error" role="alert"></p>
    </section>
  </main>
</body>
</html>

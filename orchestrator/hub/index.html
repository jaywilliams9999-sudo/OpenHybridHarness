<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="hub-secret" content="{{HUB_SECRET}}">
  <title>OpenHybridHarness · Hub</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="mark" href="/">OpenHybrid<span>Harness</span></a>
    <nav class="nav" aria-label="Pages">
      <a href="/" aria-current="page">Board</a>
      <a href="/models">Models</a>
    </nav>
  </header>

  <main class="page">
    <section id="card" class="strip" aria-label="GPU"></section>

    <form id="start" class="start" autocomplete="off">
      <label class="sr-only" for="goal">Goal</label>
      <textarea id="goal" name="goal" rows="1" maxlength="2000" placeholder="Describe a goal…" required></textarea>
      <label class="budget" for="budget" title="The most this goal may spend, in US dollars">
        <span aria-hidden="true">$</span>
        <span class="sr-only">Budget in US dollars</span>
        <input id="budget" name="budget" type="number" inputmode="decimal" min="0.01" max="10" step="0.01" value="1.50">
      </label>
      <button id="start-go" class="btn btn--start" type="submit">Start</button>
      <p id="start-error" class="inline-error" role="alert"></p>
    </form>

    <div class="board">
      <section class="column" aria-labelledby="h-working">
        <h2 id="h-working" class="column-head">Working <span class="count"></span></h2>
        <div id="col-working" class="column-list"></div>
      </section>
      <section class="column column--needs" aria-labelledby="h-needs">
        <h2 id="h-needs" class="column-head">Needs you <span class="count"></span></h2>
        <div id="col-needs" class="column-list"></div>
      </section>
      <section class="column" aria-labelledby="h-done">
        <h2 id="h-done" class="column-head">Done <span class="count"></span></h2>
        <div id="col-done" class="column-list"></div>
      </section>
    </div>
  </main>

  <dialog id="detail" class="detail" aria-label="The goal's story">
    <button id="detail-close" class="detail-close" type="button" aria-label="Close">×</button>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
